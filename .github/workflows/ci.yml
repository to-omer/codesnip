name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'


jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup `stable`
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: stable
        components: rustfmt

    - name: cargo-fmt
      run: cargo fmt --all -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable-x86_64-pc-windows-msvc
          - stable-aarch64-apple-darwin
          - stable-x86_64-unknown-linux-gnu
        include:
          - { toolchain: stable-x86_64-pc-windows-msvc   , target: x86_64-pc-windows-msvc  , os: windows-latest }
          - { toolchain: stable-aarch64-apple-darwin     , target: aarch64-apple-darwin    , os: macos-latest  }
          - { toolchain: stable-x86_64-unknown-linux-gnu , target: x86_64-unknown-linux-gnu, os: ubuntu-latest }

    name: Build (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup `${{ matrix.toolchain }}`
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: ${{ matrix.toolchain }}
        components: clippy, rustfmt

    - name: cargo-clippy
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    - name: cargo-build
      run: cargo build --locked --workspace --all-targets --all-features

    - name: cargo-test
      run: |
        cargo test --locked --workspace --no-fail-fast
        cargo test --locked --workspace --all-features --no-fail-fast
      env:
        RUST_BACKTRACE: full

  upload:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable-x86_64-pc-windows-msvc
          - stable-aarch64-apple-darwin
          - stable-x86_64-unknown-linux-gnu
        include:
          - { toolchain: stable-x86_64-pc-windows-msvc  , target: x86_64-pc-windows-msvc  , os: windows-latest, exe-suffix: .exe, archive-suffix: .zip }
          - { toolchain: stable-aarch64-apple-darwin    , target: aarch64-apple-darwin    , os: macos-latest  , exe-suffix: ''   , archive-suffix: .tgz }
          - { toolchain: stable-x86_64-unknown-linux-gnu, target: x86_64-unknown-linux-musl, os: ubuntu-latest , exe-suffix: ''   , archive-suffix: .tgz }

    name: Distribution (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup `${{ matrix.toolchain }}`
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: cargo-install
        run: cargo install --path ./codesnip -v --locked --target ${{ matrix.target }} --features vendored

      - name: Check Linux binary dependencies
        if: runner.os == 'Linux'
        run: |
          dependencies="$(readelf -d "$HOME/.cargo/bin/cargo-codesnip")"
          printf '%s\n' "$dependencies"
          if [[ "$dependencies" == *'(NEEDED)'* ]]; then
            echo 'The Linux binary must not require shared libraries.' >&2
            exit 1
          fi

      - name: Check macOS binary dependencies
        if: runner.os == 'macOS'
        run: |
          dependencies="$(otool -L "$HOME/.cargo/bin/cargo-codesnip")"
          printf '%s\n' "$dependencies"
          printf '%s\n' "$dependencies" | awk '
            NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library)\// { print "Unexpected dependency: " $1; failed = 1 }
            END { exit failed }
          '

      - name: Check Windows binary dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          $dependencies = & "$vs\VC\Tools\MSVC\$version\bin\Hostx64\x64\dumpbin.exe" /DEPENDENTS "$env:USERPROFILE\.cargo\bin\cargo-codesnip.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies
          if ($dependencies -match '(?i)(vcruntime|msvcp|api-ms-win-crt-|libssl|libcrypto)') {
            throw 'The Windows binary must not require external OpenSSL or C/C++ runtimes.'
          }

      - name: Check binary startup
        run: '"$HOME/.cargo/bin/cargo-codesnip${{ matrix.exe-suffix }}" --version'
        shell: bash

      - name: Create an asset
        if: startsWith(github.ref, 'refs/tags/')
        id: asset
        run: |
          PKG_NAME=codesnip
          BIN_TARGET=cargo-codesnip
          ASSET_STEM="$PKG_NAME-${{ matrix.target }}-${GITHUB_REF#refs/tags/}"
          mkdir "$ASSET_STEM"
          mv "$HOME/.cargo/bin/${BIN_TARGET}${{ matrix.exe-suffix }}" "./$ASSET_STEM/"
          if ${{ contains(matrix.toolchain, 'pc-windows') }}; then
            ASSET="$ASSET_STEM${{ matrix.archive-suffix }}"
            7z a "$ASSET" "./$ASSET_STEM"
          else
            ASSET="$ASSET_STEM${{ matrix.archive-suffix }}"
            tar -czvf "./$ASSET" "./$ASSET_STEM"
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload the artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.toolchain }}
          path: ${{ steps.asset.outputs.asset }}


  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [fmt, build, upload]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download the assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: ./assets
          merge-multiple: true

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ./assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
