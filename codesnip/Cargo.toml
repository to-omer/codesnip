[package]
name = "codesnip"
version = "0.5.3"
authors = ["to-omer <toomerhs@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "snippet bundle tool"
repository = "https://github.com/to-omer/codesnip"
documentation = "https://docs.rs/codesnip"

[[bin]]
name = "cargo-codesnip"
path = "src/main.rs"
doc = false

[[example]]
name = "math"
crate-type = ["lib"]

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["alloc", "serde"] }
cargo_metadata = "0.23.1"
codesnip_attr = { version = "0.5.0", path = "../codesnip_attr" }
codesnip_core = { version = "0.5.1", path = "../codesnip_core" }
console = "0.16.6"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
indicatif = "0.18.6"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"
structopt = "0.3.26"
syn = { version = "3.0.6", features = ["full"] }
tempfile = "3.27.0"
toml = "1.1.6"
